[package]
name = "lynn"
version = "0.1.2"
edition = "2021"
description = "A small shared shell for humans and coding agents"
license = "Apache-2.0"
repository = "https://github.com/patrickgwsmith/lynn"
readme = "README.md"

[[bin]]
name = "lynn"
path = "src/main.rs"

[dependencies]
libc = "0.2"
quick-xml = "0.42"
serde_json = "1"
ureq = "3"
unicode-width = "0.2"
